name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 2.2.3，留空则自动使用 Cargo.toml 版本)'
        required: false
        default: ''
        type: string
      model_version:
        description: '模型版本'
        required: true
        default: 'all'
        type: choice
        options:
          - v4
          - v5
          - v6
          - all

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 创建 Tag (仅在 workflow_dispatch 手动触发时) ────────
  create-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "Will create tag: v$VER"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.ver }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping creation"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        id: tag
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          TAG="v${{ steps.version.outputs.ver }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Tag $TAG created and pushed"

  # ── Linux (Ubuntu 20.04 容器，兼容旧版系统) ──────────
  build-linux-legacy:
    needs: create-tag
    if: |
      always() &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        version: [v4, v5, v6]
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y curl build-essential cmake git pkg-config libssl-dev libclang-dev clang

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v4

      - name: Build (${{ matrix.version }}, build-mnn-from-source, static-libstdcpp)
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        run: |
          export LIBCLANG_PATH=$(find /usr/lib -name "libclang.so*" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          cargo build --release --features bundle-models-${{ matrix.version }},build-mnn-from-source,static-libstdcpp
          cp target/release/ocr-cli ./ocr-cli-${{ matrix.version }}-linux-legacy-x86_64

      - name: Upload artifact
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        uses: actions/upload-artifact@v4
        with:
          name: ocr-cli-${{ matrix.version }}-linux-legacy-x86_64
          path: ocr-cli-${{ matrix.version }}-linux-legacy-x86_64

  # ── Linux (latest, static-libstdcpp) ──────────────────
  build-linux:
    needs: create-tag
    if: |
      always() &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v4, v5, v6]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build (${{ matrix.version }}, static-libstdcpp)
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        run: |
          cargo build --release --features bundle-models-${{ matrix.version }},static-libstdcpp
          cp target/release/ocr-cli ./ocr-cli-${{ matrix.version }}-linux-x86_64

      - name: Upload artifact
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        uses: actions/upload-artifact@v4
        with:
          name: ocr-cli-${{ matrix.version }}-linux-x86_64
          path: ocr-cli-${{ matrix.version }}-linux-x86_64

  # ── macOS (arm64 + x86_64) ────────────────────────────
  build-macos:
    needs: create-tag
    if: |
      always() &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v4, v5, v6]
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ matrix.target }}

      - name: Build (${{ matrix.version }}, ${{ matrix.target }})
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        run: |
          cargo build --release --target ${{ matrix.target }} --features bundle-models-${{ matrix.version }}
          cp target/${{ matrix.target }}/release/ocr-cli ./ocr-cli-${{ matrix.version }}-${{ matrix.target }}

      - name: Upload artifact
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        uses: actions/upload-artifact@v4
        with:
          name: ocr-cli-${{ matrix.version }}-${{ matrix.target }}
          path: ocr-cli-${{ matrix.version }}-${{ matrix.target }}

  # ── Windows ───────────────────────────────────────────
  build-windows:
    needs: create-tag
    if: |
      always() &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v4, v5, v6]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build (${{ matrix.version }})
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        run: |
          cargo build --release --features bundle-models-${{ matrix.version }}
          copy target\release\ocr-cli.exe ocr-cli-${{ matrix.version }}-windows-x86_64.exe

      - name: Upload artifact
        if: |
          github.event_name == 'push' ||
          github.event.inputs.model_version == 'all' ||
          github.event.inputs.model_version == matrix.version
        uses: actions/upload-artifact@v4
        with:
          name: ocr-cli-${{ matrix.version }}-windows-x86_64
          path: ocr-cli-${{ matrix.version }}-windows-x86_64.exe

  # ── Create GitHub Release ─────────────────────────────
  create-release:
    needs:
      - build-linux-legacy
      - build-linux
      - build-macos
      - build-windows
    if: |
      always() &&
      (!contains(needs.*.result, 'failure')) &&
      (!contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              VER="${{ github.event.inputs.version }}"
            else
              VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            fi
            echo "tag=v$VER" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "Release tag: v${VER}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
